[project]
name = "etl-forex-time-series-data"
version = "0.0.1"
description = "Fetches OHLCV candlestick, swap-rate, economic calendar, and positioning data and writes it to InfluxDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Badass Data Science" },
]
keywords = ["forex", "etl", "time-series", "oanda", "influxdb", "prefect"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "prefect",
    "pydantic",
    "requests",
    "tenacity",
    "pandas",
    "numpy",
    "matplotlib",
    "influxdb-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/badass-data-science/ETL-forex-time-series-data"
Changelog = "https://github.com/badass-data-science/ETL-forex-time-series-data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
