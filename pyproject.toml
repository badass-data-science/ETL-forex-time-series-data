[project]
name = "etl-forex-time-series-data"
version = "0.0.1"
description = "Fetches OHLCV candlestick, swap-rate, economic calendar, and positioning data and writes it to InfluxDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prefect",
    "pydantic",
    "requests",
    "tenacity",
    "pandas",
    "numpy",
    "matplotlib",
    "boto3",
    "influxdb-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
