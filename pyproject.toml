[project]
name = "etl-forex-time-series-data"
version = "0.0.3"
description = "Fetches OHLCV candlestick, swap-rate, economic calendar, and positioning data and writes it to InfluxDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Badass Data Science" },
]
keywords = ["forex", "etl", "time-series", "oanda", "influxdb", "prefect"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "prefect",
    "pydantic",
    "requests",
    "tenacity",
    "pandas",
    "numpy",
    "matplotlib",
    "influxdb-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/badass-data-science/ETL-forex-time-series-data"
Changelog = "https://github.com/badass-data-science/ETL-forex-time-series-data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM103",  # inlining these guard clauses hurts readability more than it helps
]

[tool.ruff.format]
quote-style = "single"  # matches the codebase's existing convention

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["forex"]

[tool.coverage.report]
# Reflects the current honest baseline (~70%): flow/pipeline orchestration
# wrappers (Prefect tasks, serve.py) are thin glue over already-tested ETL
# classes and are exercised manually/in staging rather than unit-tested --
# mocking Prefect's decorators just to hit a number isn't worth it. This
# threshold exists to catch real regressions in the parts that ARE unit
# tested, not to chase 100% on glue code.
fail_under = 65
