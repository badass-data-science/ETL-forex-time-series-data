name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          # `import python_tools_and_shortcuts...` resolves to a CI-only vendored
          # copy (see ci/vendor/README.md) -- not needed/used outside of CI.
          PYTHONPATH: ${{ github.workspace }}/ci/vendor
        run: pytest tests -v
